name: User Story
description: Describe a feature from the user's perspective.
title: "[User Story]"
labels: ["type:user-story"]

body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Describe who needs the feature, what they want, and why.
      placeholder: |
        Jako [rola] chcę [funkcjonalność], aby [korzyść].
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met for this story to be considered complete.
      placeholder: |
        - [ ] Kryterium 1
        - [ ] Kryterium 2
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: Additional Information
      description: Add any relevant context, references, or mockups.
    validations:
      required: false
